<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9:16 Puzzle Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="panel">
    <h1>9:16 Puzzle Maker</h1>

    <label>Background Image</label>
    <input type="file" id="backgroundInput" accept="image/*">

    <div class="grid">
      <div><label>A PNG</label><input type="file" id="inputA" accept="image/*"></div>
      <div><label>B PNG</label><input type="file" id="inputB" accept="image/*"></div>
      <div><label>C PNG</label><input type="file" id="inputC" accept="image/*"></div>
      <div><label>D PNG</label><input type="file" id="inputD" accept="image/*"></div>
    </div>

    <label>Animation Order</label>
    <input id="animationOrder" value="C,B,A,D">

    <label>Target Order</label>
    <input id="targetOrder" value="A,B,C,D">

    <label>Split: <span id="splitValue">50</span>%</label>
    <input id="splitRange" type="range" min="30" max="70" value="50">

    <label>Image Size: <span id="sizeValue">340</span> px</label>
    <input id="sizeRange" type="range" min="250" max="550" value="340">

    <label>Move Duration (ms)</label>
    <input id="duration" type="number" value="1500" min="300" step="100">

    <label>Result Hold (ms)</label>
    <input id="pauseDuration" type="number" value="1000" min="200" step="100">

    <label>Animation Direction</label>
    <select id="direction">
      <option value="top-right">Top Right</option>
      <option value="top">Top Center</option>
      <option value="right">Right</option>
      <option value="left">Left</option>
    </select>

    <h2>Match Rules</h2>
    <div id="rulesContainer"></div>

    <h2>Animation Flow</h2>
    <div id="flowContainer"></div>

    <div class="buttons">
      <button id="previewBtn">▶ Preview</button>
      <button id="pauseBtn">⏸ Pause</button>
      <button id="restartBtn">↻ Restart</button>
      <button id="exportBtn">⬇ Export Video</button>
    </div>

    <div id="statusTitle">Ready</div>
    <div id="statusMessage">Upload your background and PNG pieces.</div>
    <div id="exportStatus"></div>
    <div class="progress"><div id="progressBar"></div></div>
  </div>

  <div class="preview">
    <canvas id="canvas" width="1080" height="1920"></canvas>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
