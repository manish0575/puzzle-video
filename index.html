<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Half Match Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- LEFT CONTROL PANEL -->
  <div class="controls">

    <h1>Half Match Puzzle</h1>

    <label>Background Image</label>
    <input type="file" id="backgroundInput" accept="image/*">

    <div class="upload-grid">

      <div>
        <label>A PNG</label>
        <input type="file" id="inputA" accept="image/png,image/*">
      </div>

      <div>
        <label>B PNG</label>
        <input type="file" id="inputB" accept="image/png,image/*">
      </div>

      <div>
        <label>C PNG</label>
        <input type="file" id="inputC" accept="image/png,image/*">
      </div>

      <div>
        <label>D PNG</label>
        <input type="file" id="inputD" accept="image/png,image/*">
      </div>

    </div>

    <label>Split Percentage</label>

    <div class="range-row">
      <input
        type="range"
        id="splitRange"
        min="30"
        max="50"
        value="50"
      >

      <span id="splitValue">50%</span>
    </div>

    <label>Image Size</label>

    <div class="range-row">
      <input
        type="range"
        id="sizeRange"
        min="250"
        max="700"
        value="420"
      >

      <span id="sizeValue">420px</span>
    </div>

    <label>Animation Speed</label>

    <input
      type="number"
      id="duration"
      value="1500"
      min="500"
      max="5000"
      step="100"
    >

    <label>Wrong / Right Hold</label>

    <input
      type="number"
      id="pauseDuration"
      value="900"
      min="300"
      max="3000"
      step="100"
    >

    <h2>Matching Rules</h2>

    <div id="rulesContainer"></div>

    <h2>Series</h2>

    <div class="series-box">
      <span>D</span>
      <span>→</span>
      <span>C</span>
      <span>→</span>
      <span>B</span>
      <span>→</span>
      <span>A</span>
    </div>

    <div class="buttons">

      <button id="previewBtn">
        ▶ Preview
      </button>

      <button id="pauseBtn">
        ⏸ Pause
      </button>

      <button id="restartBtn">
        ↻ Restart
      </button>

      <button id="exportBtn">
        ⬇ Export Video
      </button>

    </div>

    <div class="status">
      <div id="statusTitle">Ready</div>
      <div id="statusMessage">
        Background aur PNG images upload karo.
      </div>
    </div>

    <div class="export-status" id="exportStatus"></div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

  </div>


  <!-- PREVIEW -->
  <div class="preview-area">

    <canvas
      id="canvas"
      width="1080"
      height="1920"
    ></canvas>

  </div>

</div>

<script src="script.js"></script>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script src="script.js"></script>

</body>
</html>
